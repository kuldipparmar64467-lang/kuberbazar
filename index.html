<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KUBER BAZAR — Telegram</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0a0a0a;
        }

        /* ── background ── */
        .bg-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.3);
            width: 80vmin;
            height: 80vmin;
            background-image: url('image.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: blur(40px) brightness(0.4) saturate(1.2);
            opacity: 0.8;
            animation: float 8s ease-in-out infinite;
        }

        .bg-overlay {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(220, 38, 38, 0.15) 0%, transparent 50%);
            z-index: 1;
        }

        .particles {
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(212, 175, 55, 0.6);
            border-radius: 50%;
            animation: rise 12s infinite ease-in;
        }
        .particle:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            animation-duration: 10s;
        }
        .particle:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
            animation-duration: 14s;
            width: 6px;
            height: 6px;
        }
        .particle:nth-child(3) {
            left: 40%;
            animation-delay: 4s;
            animation-duration: 11s;
        }
        .particle:nth-child(4) {
            left: 55%;
            animation-delay: 1s;
            animation-duration: 13s;
            width: 5px;
            height: 5px;
        }
        .particle:nth-child(5) {
            left: 70%;
            animation-delay: 3s;
            animation-duration: 12s;
        }
        .particle:nth-child(6) {
            left: 85%;
            animation-delay: 5s;
            animation-duration: 15s;
            width: 3px;
            height: 3px;
        }
        .particle:nth-child(7) {
            left: 15%;
            animation-delay: 6s;
            animation-duration: 10s;
        }
        .particle:nth-child(8) {
            left: 90%;
            animation-delay: 7s;
            animation-duration: 13s;
            width: 7px;
            height: 7px;
        }

        /* ── card ── */
        .card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 32px;
            padding: 48px 40px;
            text-align: center;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(212, 175, 55, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeInUp 1s ease-out;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: skewX(-20deg);
            animation: shine 6s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0%,
            80%,
            100% {
                left: -100%;
            }
            90% {
                left: 200%;
            }
        }

        /* ── ornaments ── */
        .ornament {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }
        .ornament-1 {
            top: -50px;
            left: -50px;
            animation: rotate 20s linear infinite;
        }
        .ornament-2 {
            bottom: -50px;
            right: -50px;
            animation: rotate 25s linear infinite reverse;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* ── LOGO ── */
        .logo-wrap {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 32px;
            border-radius: 50%;
            /* dark background so any empty space blends in */
            background: #0d0d0d;
            /* subtle inner shadow for depth */
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
        }

        /* glow behind logo */
        .logo-wrap::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.3), rgba(220, 38, 38, 0.3));
            filter: blur(24px);
            animation: pulse 3s ease-in-out infinite;
            z-index: -1;
        }

        .logo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* ★ FIX: show the entire image without cropping, centered ★ */
            object-fit: contain;
            object-position: center;
            background: #0d0d0d;
            border: 3px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: block;
        }

        /* ── typography ── */
        .title {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #f5e6c8;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(245, 230, 200, 0.6);
            font-weight: 300;
            margin-bottom: 32px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 0 auto 32px;
            border-radius: 2px;
        }

        /* ── Telegram button ── */
        .tg-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #229ED9, #1a8bc4);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow:
                0 10px 30px rgba(34, 158, 217, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .tg-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .tg-btn:hover::before {
            left: 100%;
        }

        .tg-btn:hover {
            transform: translateY(-3px);
            box-shadow:
                0 15px 40px rgba(34, 158, 217, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .tg-btn:active {
            transform: translateY(-1px);
        }

        .tg-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
            flex-shrink: 0;
        }

        .username {
            margin-top: 20px;
            font-size: 0.85rem;
            color: rgba(245, 230, 200, 0.4);
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .username span {
            color: rgba(34, 158, 217, 0.8);
        }

        /* ── animations ── */
        @keyframes float {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1.3) rotate(0deg);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.35) rotate(2deg);
            }
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(-20vh) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 36px 28px;
                border-radius: 24px;
            }
            .title {
                font-size: 2rem;
            }
            .logo-wrap {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- background -->
    <div class="bg-container">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- card -->
    <div class="card">
        <div class="ornament ornament-1"></div>
        <div class="ornament ornament-2"></div>

        <div class="logo-wrap">
            <img src="image.png" alt="KUBER BAZAR" class="logo" />
        </div>

        <h1 class="title">JAI KUBER MAHARAJ</h1>
        <p class="subtitle">WELCOME TO KUBER BAZAR</p>

        <div class="divider"></div>

        <a href="https://telegram.me/kuberbazarr" target="_blank" class="tg-btn">
            <svg class="tg-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.692-1.653-1.123-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
            </svg>
            Send Message
        </a>

        <p class="username">@<span>kuberbazarr</span></p>
    </div>

</body>
</html>
